<!DOCTYPE html>
<html lang='de'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revox CD Remote</title>
    <link rel='stylesheet' href='style.css'>
    <script src='script.js'></script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

<body data-world="receiver">
    <!-- Header-Bereich -->
    <header>
        <h3>Revox Receiver<br>B285</h3>
    </header>

    <!-- Geräteauswahl (Eindeutige IDs für HTML, data-id für JavaScript/WebSocket) -->
    <div class='button-group-container-dev span2'>
        <span class='button-group-title-dev'>Ger&auml;teauswahl</span>
        <a href='tape1_recv.html' id='nav_amptape1' data-id='amptape1' name='page' class='button span1'>Tape1</a>
        <a href='tape2_recv.html' id='nav_amptape2' data-id='amptape2' name='page' class='button span1'>Tape2</a>
        <a href='phono_recv.html' id='nav_ampphono' data-id='ampphono' name='page' class='button span1'>Phono</a>
        <a href='cd_recv.html'    id='nav_ampcd'    data-id='ampcd'    name='page' class='button span1'>CD</a>
        <a href='b203_recv.html'  id='b203'                            name='page' class='button span1'>B203</a>
    </div>

    <!-- Tab-Navigation -->
    <div class="tab">
        <button type="button" class="tablinks active" onclick="openB203(event, 'B285tab')">Control</button>
        <button type="button" class="tablinks" onclick="openB203(event, 'B285Statustab')">Status</button>
    </div>

    <!-- ========================================== -->
    <!-- START: Control-Tab Inhalt -->
    <!-- ========================================== -->
    <div id="B285tab" class="tabcontent" style="display:block">
		
        <!-- Power-Buttons -->
        <div class='button-pwr-container-dev span2'>
            <p><button type="button" name='button' id='amppoweron' class='power_btn span12 load_color'>ON</button></p>
            <p><button type="button" name='button' id='amppoweroff' class='power_btn span12 pwr_color'>OFF</button></p>
        </div>

        <!-- Tuner-Stationen 1-29 -->
        <div class='system-group-container span2'>
            <p><button type="button" name='button' id='tun1' class='button span3'>1</button></p>
            <p><button type="button" name='button' id='tun2' class='button span3'>2</button></p>
            <p><button type="button" name='button' id='tun3' class='button span3'>3</button></p>
            <p><button type="button" name='button' id='tun4' class='button span3'>4</button></p>
            <p><button type="button" name='button' id='tun5' class='button span3'>5</button></p>
            <p><button type="button" name='button' id='tun6' class='button span3'>6</button></p>
            <p><button type="button" name='button' id='tun7' class='button span3'>7</button></p>
            <p><button type="button" name='button' id='tun8' class='button span3'>8</button></p>
            <p><button type="button" name='button' id='tun9' class='button span3'>9</button></p>
            <p><button type="button" name='button' id='tun10' class='button span3'>10</button></p>
            <p><button type="button" name='button' id='tun11' class='button span3'>11</button></p>
            <p><button type="button" name='button' id='tun12' class='button span3'>12</button></p>
            <p><button type="button" name='button' id='tun13' class='button span3'>13</button></p>
            <p><button type="button" name='button' id='tun14' class='button span3'>14</button></p>
            <p><button type="button" name='button' id='tun15' class='button span3'>15</button></p>
            <p><button type="button" name='button' id='tun16' class='button span3'>16</button></p>
            <p><button type="button" name='button' id='tun17' class='button span3'>17</button></p>
            <p><button type="button" name='button' id='tun18' class='button span3'>18</button></p>
            <p><button type="button" name='button' id='tun19' class='button span3'>19</button></p>
            <p><button type="button" name='button' id='tun20' class='button span3'>20</button></p>
            <p><button type="button" name='button' id='tun21' class='button span3'>21</button></p>
            <p><button type="button" name='button' id='tun22' class='button span3'>22</button></p>
            <p><button type="button" name='button' id='tun23' class='button span3'>23</button></p>
            <p><button type="button" name='button' id='tun24' class='button span3'>24</button></p>
            <p><button type="button" name='button' id='tun25' class='button span3'>25</button></p>
            <p><button type="button" name='button' id='tun26' class='button span3'>26</button></p>
            <p><button type="button" name='button' id='tun27' class='button span3'>27</button></p>
            <p><button type="button" name='button' id='tun28' class='button span3'>28</button></p>
            <p><button type="button" name='button' id='tun29' class='button span3'>29</button></p>
        </div>

        <!-- Tuner-Steuerung & Volume-Slider -->
        <div class='system-group-container span2'>
            <p><button type="button" name='button' id='tunscannext' class='button span6'>Scan next ></button></p>
            <p><button type="button" name='button' id='tun10on' class='button span6'>Enter</button></p>
            <p><button type="button" name='button' id='tunvoldn' class='button span6'>Volume -</button></p>
            <p><button type="button" name='button' id='tunvolup' class='button span6'>Volume +</button></p>
            <label for="volumeSlider" class="slide-label">Lautst&auml;rke:</label>
            <input type="range" min="0" max="99" value="50" id="volumeSlider" name="volSlider" class='slide' style="transform: scaleX(-1);">
        </div>
        
	        <label for="speakers">Lautsprecher:</label>
            <!--<select class="b203set" id="speakers" name="speakers" onchange="handleSpeakerChange(event)">-->
            <select class="b203set" id="speakers" name="speakers">
                <option value="0">Lautsprecher aus</option>
                <option value="1">Lautsprecher A</option>
                <option value="2">Lautsprecher B</option>
                <option value="3">Lautsprecher A & B</option>
            </select>

        <!-- Lautsprecher-Schalter (Bedienung) 
        <div class='select-group-container span2'>
            <label for="setspeakers">Lautsprecher:</label>
            <select class="b203set" id='setspeakers' name="speakers">
                <option value="L0">Lautsprecher aus</option>
                <option value="L1">Lautsprecher A</option>
                <option value="L2">Lautsprecher B</option>
                <option value="L3">Lautsprecher A & B</option>
            </select>
        </div>-->
		
        <!-- Signalquellen Buttons -->
        <div class='system-group-container span2'>
            <p><button type="button" name='button' id='amptape1' class='button span4'>Tape1</button></p>
            <p><button type="button" name='button' id='amptape2' class='button span4'>Tape2</button></p>
            <p><button type="button" name='button' id='ampphono' class='button span4'>Phono</button></p>
            <p><button type="button" name='button' id='ampcd' class='button span4'>CD</button></p>
            <p><button type="button" name='button' id='amprecmon' class='button span4'>Tape Mon 1</button></p>
            <p><button type="button" name='button' id='ampvolupx' class='button span4'>Tape Mon 2</button></p>
            <p><button type="button" name='button' id='amptone' class='button span4'>Tone control</button></p>
            <p><button type="button" name='button' id='ampvoldnx' class='button span4'>Loudness</button></p>
            <p><button type="button" name='button' id='amp20db' class='button span4'>-20dB</button></p>
        </div>

        <!-- Balance & Volume -->
        <div class='system-group-container span2'>
            <p><button type="button" name='button' id='ampbal_r' class='button span6'>Balance R</button></p>
            <p><button type="button" name='button' id='ampbal_l' class='button span6'>Balance L</button></p>
            <p><button type="button" name='button' id='ampvoldn' class='button span6'>Volume -</button></p>
            <p><button type="button" name='button' id='ampvolup' class='button span6'>Volume +</button></p>
        </div>

        <!-- Zusatzfunktionen (Misc) -->
        <div class='button-group-container-misc span2'>
            <p><button type="button" name='button' id='tunreccal' class='misc_button span4'>Speakers A</button></p>
            <p><button type="button" name='button' id='tunstonly' class='misc_button span4'>SpeakersB</button></p>
            <p><button type="button" name='button' id='tunstore' class='misc_button span4'>Store</button></p>
            <p><button type="button" name='button' id='tunmono' class='misc_button span4'>Mono</button></p>
            <p><button type="button" name='button' id='tunmute' class='misc_button span4'>Muting</button></p>
            <p><button type="button" name='button' id='tunhighblend' class='misc_button span4'>High Blend</button></p>
            <p><button type="button" name='button' id='tunantenna' class='misc_button span4'>Test Mode</button></p>
        </div>
    </div>
    <!-- ========================================== -->
    <!-- ENDE: Control-Tab Inhalt -->
    <!-- ========================================== -->


    <!-- ========================================== -->
    <!-- START: Status-Tab Inhalt -->
    <!-- ========================================== -->
    <div id="B285Statustab" class="tabcontent" style="display:none;">
		
        <div class='select-group-container span2'>
            <span class='select-group-title-dev'>Status</span>
		
            <!-- Signalquellen Statusanzeige -->
            <label for="b285source">Signalquelle</label>
            <select class="b203set" id="b285source" name="select" disabled>
                <option value="0">Standby</option>
                <option value="1">Tape 1</option>
                <option value="2">Tape 2</option>
                <option value="3">Disk</option>
                <option value="4">Phono</option>
                <option value="5">Tuner FM</option>
                <option value="6">Tuner AM</option>
                <option value="7">Monitor Tape 1</option>
                 <option value="8">Monitor Tape 2</option>
                <option value="9">Status unerkannt</option>
            </select>

            <label for="volume">Volume</label>
            <input type="text" id="volume" class="b203set" value="" disabled>

            <label for="tunerstation">Tuner-Station</label>
            <input type="text" id="tunerstation" class="b203set" value="" disabled>

            <label for="stationid">Stations-Kennung</label>
            <input type="text" id="stationid" class="b203set" value="" disabled>

            <label for="frequency">Frequenz</label>
            <input type="text" id="frequency" class="b203set" value="" disabled>

            <p><button type="button" name="getb285settings" id="b285_get" class="set_button span12">Laden</button></p>
        </div>
    </div>
    <!-- ENDE: Status-Tab Inhalt -->

</body>
</html>
